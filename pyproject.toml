[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-edgewalk"
version = "0.7.2"
description = "Deterministic Golay Tanner and ETQ-inspired edge-walk research"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["edgewalk*"]


[project.optional-dependencies]
stability = ["numpy>=1.24", "scipy>=1.10"]


[tool.setuptools.package-data]
edgewalk = ["data/*.csv"]
